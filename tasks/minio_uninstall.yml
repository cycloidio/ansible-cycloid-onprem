---
# Temporary compatibility task for removing only a legacy MinIO service after
# its objects have been exported and verified.
- name: Check the verified MinIO export | minio
  stat:
    path: "{{ legacy_minio_export_path }}"
  register: minio_export
  when: legacy_minio_export_path | length > 0

- name: Check that the verified MinIO export contains objects | minio
  find:
    paths: "{{ legacy_minio_export_path }}"
    recurse: true
    hidden: true
    file_type: file
  register: minio_export_files
  when:
    - minio_export.stat.isdir | default(false)

- name: Require a verified MinIO export before cleanup | minio
  assert:
    that:
      - legacy_minio_export_path | length > 0
      - minio_export.stat.exists | default(false)
      - minio_export.stat.isdir | default(false)
      - minio_export_files.matched | default(0) | int > 0
    fail_msg: >-
      Set legacy_minio_export_path to a verified, non-empty staging directory
      on this host before removing the legacy MinIO service and data.

- name: Stop and disable the legacy MinIO service | minio
  service:
    name: minio_container
    state: stopped
    enabled: false
  failed_when: false

- name: Remove the legacy MinIO container | minio
  command: docker rm -f minio
  register: minio_container_remove
  changed_when: minio_container_remove.rc == 0
  failed_when: false

- name: Remove legacy files | minio
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ minio_config_path | default(cycloid_install_path + '/minio') }}"
    - /etc/systemd/system/minio_container.service
    - /etc/default/minio
    - /etc/sysconfig/minio

- name: Force systemd to reread configs | minio
  systemd:
    daemon_reload: yes

- name: systemctl reset-failed | minio
  shell: systemctl reset-failed

---
- name: Stop services | cycloid-ai
  service:
    name: "{{ item }}"
    state: stopped
  with_items:
    - cycloid-ai-langgraph_container
    - cycloid-ai-chromadb_container
    - cycloid-ai-postgres_container
    - cycloid-ai-ingest_container
  failed_when: false

- name: Stop timer | cycloid-ai
  service:
    name: cycloid-ai-ingest.timer
    state: stopped
    enabled: false
  failed_when: false

- name: Remove files | cycloid-ai
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ cycloid_ai_path }}"
    - /etc/systemd/system/cycloid-ai-langgraph_container.service
    - /etc/systemd/system/cycloid-ai-chromadb_container.service
    - /etc/systemd/system/cycloid-ai-postgres_container.service
    - /etc/systemd/system/cycloid-ai-ingest_container.service
    - /lib/systemd/system/cycloid-ai-ingest.timer
    - /etc/default/cycloid-ai-langgraph
    - /etc/default/cycloid-ai-chromadb
    - /etc/default/cycloid-ai-postgres
    - /etc/default/cycloid-ai-ingest

- name: Force systemd to reread configs | cycloid-ai
  systemd:
    daemon_reload: yes

- name: systemctl reset-failed | cycloid-ai
  shell: systemctl reset-failed

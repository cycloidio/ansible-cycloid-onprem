---
- name: Stop services | cycloid-plugins
  service:
    name: "{{ item }}"
    state: stopped
  with_items:
    - cycloid-plugins-docker-registry_container
    - cycloid-plugins-registry_container
    - cycloid-plugins-manager_container
  failed_when: false

- name: Remove files | cycloid-plugins
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ cycloid_plugins_path }}"
    - /etc/systemd/system/cycloid-plugins-docker-registry_container.service
    - /etc/systemd/system/cycloid-plugins-registry_container.service
    - /etc/systemd/system/cycloid-plugins-manager_container.service
    - /etc/default/cycloid-plugins-docker-registry
    - /etc/default/cycloid-plugins-registry
    - /etc/default/cycloid-plugins-manager

- name: Force systemd to reread configs | cycloid-plugins
  systemd:
    daemon_reload: yes

- name: systemctl reset-failed | cycloid-plugins
  shell: systemctl reset-failed

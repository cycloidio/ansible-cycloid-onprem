---
- name: Converge
  hosts: cycloid_worker

  vars_files:
    - roles/ansible-cycloid-onprem/defaults/main.yml
    - [ "environments/cycloid.yml", "environments/{{ env }}-cycloid.yml", "environments/empty.yml" ]

  pre_tasks:

    # The Concourse containerd runtime hard-codes /run/containerd/containerd.sock.
    # Isolate that path from Docker's containerd socket on all-in-one hosts.
    - name: Create private containerd runtime directory | concourse
      file:
        path: /run/concourse-worker/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: concourse_worker_runtime == "containerd"

    - name: Restore private containerd runtime directory at boot | concourse
      copy:
        dest: /etc/tmpfiles.d/concourse-worker-containerd.conf
        content: "d /run/concourse-worker/containerd 0755 root root -\n"
        owner: root
        group: root
        mode: "0644"
      when: concourse_worker_runtime == "containerd"

    - name: Create worker service override directory | concourse
      file:
        path: /etc/systemd/system/concourse-worker.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: concourse_worker_runtime == "containerd"

    - name: Isolate worker containerd socket from the host runtime | concourse
      copy:
        dest: /etc/systemd/system/concourse-worker.service.d/containerd-runtime.conf
        content: |
          [Unit]
          After=systemd-tmpfiles-setup.service

          [Service]
          BindPaths=/run/concourse-worker/containerd:/run/containerd
        owner: root
        group: root
        mode: "0644"
      register: concourse_containerd_override
      when: concourse_worker_runtime == "containerd"

    - name: Reload systemd worker override | concourse
      systemd:
        daemon_reload: yes
      when:
        - concourse_worker_runtime == "containerd"
        - concourse_containerd_override.changed

    - name: Install extra packages | pre-setup
      package:
        name:
          - gnupg2
        state: present

    # Copy a rootCa on the host servers
    - name: Create root certificates directory | pre-setup
      file:
        path: "{{ ca_certificates_path[ansible_os_family | lower] }}"
        state: directory
        #mode: 0750
        recurse: yes

    - name: Copy root certificates | pre-setup
      copy:
        src: "{{ item }}"
        dest: "{{ ca_certificates_path[ansible_os_family | lower] }}/"
        owner: "root"
        mode: 0644
      with_fileglob:
        - "{{ ca_certificates_local_path }}"
      register: certificates

    - name: update ca-certificates | pre-setup
      command: "{{ ca_certificates_handler[ansible_os_family | lower] }}"
      when: certificates.changed

    - name: Set CONCOURSE_CERTS_DIR | concourse
      set_fact:
       concourse_worker_env: "{{ concourse_worker_env | combine({'CONCOURSE_CERTS_DIR': '/etc/ssl/certs/'}) }}"
      when: ca_certificates_container_shared|bool

  roles:
    - role: prometheus.prometheus.node_exporter
      tags: node-exporter
      when: enable_monitoring|bool
      #vars:
      # to add collectors use the var node_exporter_enabled_collectors
      # full list of collectors at https://github.com/prometheus/node_exporter?tab=readme-ov-file#collectors
      # role defaults at https://github.com/prometheus-community/ansible/blob/main/roles/node_exporter/defaults/main.yml

    - role: cycloid.concourse
      tags: cycloid

  post_tasks:
    # Ensure worker is started and configured at first boot
    - name: configure worker service | concourse
      service:
        name: concourse-worker
        enabled: yes
      tags:
       - notforbuild
    - name: restart concourse worker
      service:
        name: concourse-worker
        state: restarted
        enabled: yes
      tags:
       - notforbuild

kind: Added
body: 'externalRedis: add externalRedis.sentinel (masterSet and a nodes list of {host, port}) to connect Cycloid to a Redis Sentinel (high availability) cluster. Sentinel mode is enabled by providing sentinel.nodes; REDIS_URI is then generated with the "redis-sentinel://" scheme for all workloads (backend, plugins-manager, plugins-registry and cronjobs), so a single definition covers every component. Node port defaults to 26379 when omitted. TLS keeps working as before by injecting REDIS_CA_CERT via backend.extraSecretEnvVars.'

{{- if .Values.ai.enabled }}
{{- $fullName := printf "%s-ai" (include "cycloid.fullname" .) }}
{{- $secretName := printf "%s-ai" (include "cycloid.fullname" .) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullName }}-postgres
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-postgres
    {{- with .Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ $fullName }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: ai-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ai-postgres
    spec:
      {{- with .Values.ai.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ai.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.ai.postgres.image.repository }}:{{ .Values.ai.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.ai.postgres.image.pullPolicy }}
          env:
            - name: POSTGRES_USER
              value: "cyclobot"
            - name: POSTGRES_DB
              value: "cyclobot"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: postgres-password
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cyclobot", "-d", "cyclobot"]
            initialDelaySeconds: 5
            periodSeconds: 5
  {{- if .Values.ai.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.ai.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.ai.postgres.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ai.postgres.persistence.size }}
  {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-postgres
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-postgres
    {{- with .Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: ai-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
{{- end }}

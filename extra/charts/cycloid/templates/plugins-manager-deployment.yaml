{{- if .Values.plugins.enabled }}
{{- $isK8s := eq .Values.plugins.deploymentRuntime "k8s" }}
{{- $pmFullname := include "plugins.pluginManager.fullname" . }}
{{- $k8sCfg := .Values.plugins.k8s }}
{{- $pluginNs := default .Release.Namespace $k8sCfg.namespace }}
{{- $saName := default $pmFullname $k8sCfg.serviceAccount.name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $pmFullname }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    {{- include "plugins.pluginManager.selectorLabels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.plugins.pluginManager.replicaCount }}
  selector:
    matchLabels:
      {{- include "plugins.pluginManager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plugins.pluginManager.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $isK8s }}
      serviceAccountName: {{ $saName }}
      {{- end }}
      {{- with .Values.plugins.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.plugins.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: plugin-manager
          image: "{{ .Values.plugins.pluginManager.image.repository }}:{{ .Values.plugins.pluginManager.image.tag }}"
          imagePullPolicy: {{ .Values.plugins.pluginManager.image.pullPolicy }}
          {{- if not $isK8s }}
          # CRI runtime requires privileged access to the containerd socket.
          securityContext:
            privileged: true
          {{- end }}
          env:
            - name: PORT
              value: "4000"
            - name: LOG_LEVEL
              value: {{ .Values.plugins.pluginManager.logLevel | quote }}
            - name: INSECURE_SKIP_VERIFY
              value: {{ .Values.plugins.pluginManager.insecureSkipVerify | quote }}
            - name: RUN_MIGRATIONS
              value: "true"
            - name: ORGS_CANS
              value: {{ .Values.plugins.orgsCans | quote }}
            - name: CY_URL
              value: {{ .Values.backend.url | quote }}
            - name: PLUGIN_MANAGER_BASE_URL
              value: "{{ $pmFullname }}:4000"
            {{- if $isK8s }}
            # Kubernetes deployment runtime
            - name: DEPLOYMENT_RUNTIME
              value: "k8s"
            - name: K8S_NAMESPACE
              value: {{ $pluginNs | quote }}
            - name: K8S_SIDECAR_IMAGE
              value: {{ $k8sCfg.sidecarImage | quote }}
            - name: K8S_STORAGE_CLASS
              value: {{ $k8sCfg.storageClass | quote }}
            - name: K8S_STORAGE_SIZE
              value: {{ $k8sCfg.storageSize | quote }}
            - name: K8S_STORAGE_ACCESS_MODE
              value: {{ $k8sCfg.storageAccessMode | quote }}
            {{- if $k8sCfg.dns }}
            - name: K8S_DNS
              value: {{ $k8sCfg.dns | quote }}
            {{- end }}
            {{- if $k8sCfg.resources.requests.cpu }}
            - name: K8S_RESOURCES_CPU_REQUEST
              value: {{ $k8sCfg.resources.requests.cpu | quote }}
            {{- end }}
            {{- if $k8sCfg.resources.requests.memory }}
            - name: K8S_RESOURCES_MEMORY_REQUEST
              value: {{ $k8sCfg.resources.requests.memory | quote }}
            {{- end }}
            {{- if $k8sCfg.resources.limits.cpu }}
            - name: K8S_RESOURCES_CPU_LIMIT
              value: {{ $k8sCfg.resources.limits.cpu | quote }}
            {{- end }}
            {{- if $k8sCfg.resources.limits.memory }}
            - name: K8S_RESOURCES_MEMORY_LIMIT
              value: {{ $k8sCfg.resources.limits.memory | quote }}
            {{- end }}
            {{- if $k8sCfg.nodeSelector }}
            - name: K8S_NODE_SELECTOR
              value: {{ $k8sCfg.nodeSelector | toJson | quote }}
            {{- end }}
            - name: HOST_API_BASE_URL
              value: "http://{{ $pmFullname }}.{{ .Release.Namespace }}.svc.cluster.local:4000"
            {{- else }}
            # CRI/containerd deployment runtime
            - name: CONTAINERD_ADDR
              value: "/run/containerd/containerd.sock"
            {{- end }}
            # MySQL
            - name: DB_HOST
              value: {{ include "cycloid.mysqlHost" . | quote }}
            - name: DB_PORT
              value: {{ include "cycloid.mysqlPort" . | quote }}
            - name: DB_NAME
              value: {{ .Values.plugins.pluginManagerDatabaseName | quote }}
            - name: DB_USER
              value: {{ include "cycloid.mysqlUser" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "cycloid.mysqlSecretName" . }}
                  key: mysql-password
            # Redis
            - name: REDIS_HOST
              value: {{ include "cycloid.redisHost" . | quote }}
            - name: REDIS_PORT
              value: {{ include "cycloid.redisPort" . | quote }}
            - name: REDIS_DB
              value: {{ include "cycloid.redisDatabase" . | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "cycloid.redisSecretName" . }}
                  key: redis-password
                  optional: true
            - name: REDIS_URI
              value: {{ include "cycloid.redisUri" . | quote }}
            {{- if and .Values.redis.enabled }}
            - name: REDIS_CA_CERT
              valueFrom:
                secretKeyRef:
                  name: cycloid-redis-crt
                  key: ca.crt
            {{- end }}
          ports:
            - containerPort: 4000
              protocol: TCP
          resources:
            {{- toYaml .Values.plugins.pluginManager.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $pmFullname }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    {{- include "plugins.pluginManager.selectorLabels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "plugins.pluginManager.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP

{{- if $isK8s }}
{{- if $k8sCfg.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    {{- include "plugins.pluginManager.selectorLabels" . | nindent 4 }}
{{- end }}

{{- if and $k8sCfg.createNamespace (ne $pluginNs .Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $pluginNs }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $pmFullname }}
  namespace: {{ $pluginNs }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/portforward, services, persistentvolumeclaims, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $pmFullname }}
  namespace: {{ $pluginNs }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $pmFullname }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}

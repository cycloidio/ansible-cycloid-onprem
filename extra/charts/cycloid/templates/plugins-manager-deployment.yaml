{{- if .Values.plugins.enabled }}
{{- $isK8s := eq .Values.plugins.deploymentRuntime "k8s" }}
{{- $pmFullname := include "plugins.pluginManager.fullname" . }}
{{- $k8sCfg := .Values.plugins.k8s }}
{{- $pluginNs := default .Release.Namespace $k8sCfg.namespace }}
{{- $saName := default $pmFullname $k8sCfg.serviceAccount.name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $pmFullname }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    {{- include "plugins.pluginManager.selectorLabels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.plugins.pluginManager.replicaCount }}
  {{- with .Values.plugins.pluginManager.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "plugins.pluginManager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plugins.pluginManager.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $isK8s }}
      serviceAccountName: {{ $saName }}
      {{- end }}
      {{- with .Values.plugins.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.plugins.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: plugin-manager
          image: "{{ tpl .Values.plugins.image.repository $ }}:{{ .Values.plugins.image.tag | default .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.plugins.image.pullPolicy }}
          args: ["/go/youdeploy-http-api", "plugin-manager"]
          {{- if not $isK8s }}
          # CRI runtime requires privileged access to the containerd socket.
          securityContext:
            privileged: true
          {{- end }}
          env:
            - name: PLUGIN_MANAGER_PORT
              value: "4000"
            # LOG_LEVEL is the backend main-config key (no per-subcommand flag)
            - name: LOG_LEVEL
              value: {{ .Values.plugins.pluginManager.logLevel | quote }}
            - name: PLUGIN_MANAGER_INSECURE_SKIP_VERIFY
              value: {{ .Values.plugins.pluginManager.insecureSkipVerify | quote }}
            - name: PLUGIN_MANAGER_RUN_MIGRATIONS
              value: "true"
            - name: PLUGIN_MANAGER_CY_ORGS
              value: {{ .Values.plugins.orgsCans | quote }}
            - name: PLUGIN_MANAGER_CY_URL
              value: {{ .Values.backend.url | quote }}
            - name: PLUGIN_MANAGER_BACKEND_URL
              value: {{ .Values.backend.url | quote }}
            - name: PLUGIN_MANAGER_URL
              value: "{{ $pmFullname }}:4000"
            {{- if $isK8s }}
            # Kubernetes deployment runtime
            - name: PLUGIN_MANAGER_DEPLOYMENT_RUNTIME
              value: "k8s"
            - name: PLUGIN_MANAGER_K8S_NAMESPACE
              value: {{ $pluginNs | quote }}
            - name: PLUGIN_MANAGER_K8S_SIDECAR_IMAGE
              value: {{ $k8sCfg.sidecarImage | quote }}
            - name: PLUGIN_MANAGER_K8S_STORAGE_CLASS
              value: {{ $k8sCfg.storageClass | quote }}
            - name: PLUGIN_MANAGER_K8S_STORAGE_SIZE
              value: {{ $k8sCfg.storageSize | quote }}
            - name: PLUGIN_MANAGER_K8S_STORAGE_ACCESS_MODE
              value: {{ $k8sCfg.storageAccessMode | quote }}
            {{- if $k8sCfg.dns }}
            - name: PLUGIN_MANAGER_K8S_DNS
              value: {{ $k8sCfg.dns | quote }}
            {{- end }}
            {{- if $k8sCfg.resources.requests.cpu }}
            - name: PLUGIN_MANAGER_K8S_RESOURCES_CPU_REQUEST
              value: {{ $k8sCfg.resources.requests.cpu | quote }}
            {{- end }}
            {{- if $k8sCfg.resources.requests.memory }}
            - name: PLUGIN_MANAGER_K8S_RESOURCES_MEMORY_REQUEST
              value: {{ $k8sCfg.resources.requests.memory | quote }}
            {{- end }}
            {{- if $k8sCfg.resources.limits.cpu }}
            - name: PLUGIN_MANAGER_K8S_RESOURCES_CPU_LIMIT
              value: {{ $k8sCfg.resources.limits.cpu | quote }}
            {{- end }}
            {{- if $k8sCfg.resources.limits.memory }}
            - name: PLUGIN_MANAGER_K8S_RESOURCES_MEMORY_LIMIT
              value: {{ $k8sCfg.resources.limits.memory | quote }}
            {{- end }}
            {{- if $k8sCfg.nodeSelector }}
            # plugin-manager parses key=value,key2=v2 (the registry subcommand uses JSON)
            - name: PLUGIN_MANAGER_K8S_NODE_SELECTOR
              value: {{ $p := list }}{{ range $k, $v := $k8sCfg.nodeSelector }}{{ $p = append $p (printf "%s=%s" $k $v) }}{{ end }}{{ join "," $p | quote }}
            {{- end }}
            - name: PLUGIN_MANAGER_HOST_API_BASE_URL
              value: "http://{{ $pmFullname }}.{{ .Release.Namespace }}.svc.cluster.local:4000"
            {{- else }}
            # CRI/containerd deployment runtime
            - name: PLUGIN_MANAGER_CONTAINERD_SOCKET
              value: "/run/containerd/containerd.sock"
            {{- end }}
            # MySQL
            - name: PLUGIN_MANAGER_DB_HOST
              value: {{ include "cycloid.mysqlHost" . | quote }}
            - name: PLUGIN_MANAGER_DB_PORT
              value: {{ include "cycloid.mysqlPort" . | quote }}
            - name: PLUGIN_MANAGER_DB_NAME
              value: {{ .Values.plugins.pluginManagerDatabaseName | quote }}
            - name: PLUGIN_MANAGER_DB_USER
              value: {{ include "cycloid.mysqlUser" . | quote }}
            - name: PLUGIN_MANAGER_DB_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ template "cycloid.mysqlSecretName" . }}
                  key: mysql-password
            - name: REDIS_HOST
              value: {{ include "cycloid.redisHost" . | quote }}
            - name: REDIS_PORT
              value: {{ include "cycloid.redisPort" . | quote }}
            - name: REDIS_DB
              value: {{ include "cycloid.redisDatabase" . | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "cycloid.redisSecretName" . }}
                  key: redis-password
                  optional: true
            - name: PLUGIN_MANAGER_REDIS_URI
              value: {{ include "cycloid.redisUri" . | quote }}

            # Polling configuration
            {{- with .Values.plugins.pluginManager.polling }}
            {{- if .interval }}
            - name: PLUGIN_MANAGER_POLLING_INTERVAL
              value: {{ .interval | quote }}
            {{- end }}
            {{- if .timeout }}
            - name: PLUGIN_MANAGER_POLLING_TIMEOUT
              value: {{ .timeout | quote }}
            {{- end }}
            {{- if .endpoint }}
            - name: PLUGIN_MANAGER_POLLING_ENDPOINT
              value: {{ .endpoint | quote }}
            {{- end }}
            {{- if .numWorkers }}
            - name: PLUGIN_MANAGER_POLLING_NUM_WORKERS
              value: {{ .numWorkers | quote }}
            {{- end }}
            {{- end }}

            # Deploy ready timeout
            {{- if .Values.plugins.pluginManager.deployReadyTimeout }}
            - name: PLUGIN_MANAGER_DEPLOY_READY_TIMEOUT
              value: {{ .Values.plugins.pluginManager.deployReadyTimeout | quote }}
            {{- end }}

            # Check if user defined a custom redis cert
            {{- $hasRedisCert := false }}
            {{- range .Values.backend.extraSecretEnvVars }}
              {{- if eq .envName "REDIS_CA_CERT" }}
                {{- $hasRedisCert = true }}
              {{- end }}
            {{- end }}
            # If redis local and no custom redis cert, add the default
            {{- if and .Values.redis.enabled (not $hasRedisCert) }}
            - name: "PLUGIN_MANAGER_REDIS_CA_CERT"
              valueFrom:
                secretKeyRef:
                  name: cycloid-redis-crt
                  key: ca.crt
            {{- end }}

          ports:
            - containerPort: 4000
              protocol: TCP
          resources:
            {{- toYaml .Values.plugins.pluginManager.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $pmFullname }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    {{- include "plugins.pluginManager.selectorLabels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "plugins.pluginManager.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP

{{- if $isK8s }}
{{- if $k8sCfg.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    {{- include "plugins.pluginManager.selectorLabels" . | nindent 4 }}
{{- end }}

{{- if and $k8sCfg.createNamespace (ne $pluginNs .Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $pluginNs }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $pmFullname }}
  namespace: {{ $pluginNs }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $pmFullname }}
  namespace: {{ $pluginNs }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $pmFullname }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}

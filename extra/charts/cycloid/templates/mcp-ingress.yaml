{{- if and .Values.mcp.enabled .Values.mcp.ingress.enabled }}
{{- $fullName := printf "%s-mcp-server" (include "cycloid.fullname" .) }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion }}
apiVersion: networking.k8s.io/v1
{{- else }}
apiVersion: networking.k8s.io/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
    {{- with .Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.mcp.ingress.annotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.mcp.ingress.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.commonAnnotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if and .Values.mcp.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.mcp.ingress.className }}
  {{- end }}
  {{- if .Values.mcp.ingress.tls }}
  tls:
    {{- range .Values.mcp.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.mcp.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if and .pathType (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.mcp.service.port }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ $.Values.mcp.service.port }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}

{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cycloid.fullname" . }}-mcp-server
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
    {{- with .Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp-server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-server
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          env:
            - name: CY_HTTP_API_URL
              value: {{ .Values.backend.url | quote }}
            - name: CY_HTTP_PORT
              value: "8010"
          ports:
            - containerPort: 8010
              protocol: TCP
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cycloid.fullname" . }}-mcp-server
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
    {{- with .Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mcp.service.type }}
  selector:
    app.kubernetes.io/component: mcp-server
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: 8010
      protocol: TCP
{{- end }}

{{- if .Values.vault.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "cycloid.vaultApproleSecretName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cycloid.vaultApproleSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
# Priority order for each value:
#   1. Existing secret (helm upgrade — preserves whatever is there)
#   2. Migration fallback from values (first upgrade from pre-auto-init install)
#   3. Freshly generated random value (new install)
stringData:
  role-id:      {{ if $existing }}{{ index $existing.data "role-id" | b64dec | quote }}{{ else if .Values.backend.vault.roleId }}{{ .Values.backend.vault.roleId | quote }}{{ else }}{{ uuidv4 | quote }}{{ end }}
  secret-id:    {{ if $existing }}{{ index $existing.data "secret-id" | b64dec | quote }}{{ else if .Values.backend.vault.secretId }}{{ .Values.backend.vault.secretId | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
  role-id-ro:   {{ if $existing }}{{ index $existing.data "role-id-ro" | b64dec | quote }}{{ else if .Values.vaultMigration.roRoleId }}{{ .Values.vaultMigration.roRoleId | quote }}{{ else }}{{ uuidv4 | quote }}{{ end }}
  secret-id-ro: {{ if $existing }}{{ index $existing.data "secret-id-ro" | b64dec | quote }}{{ else if .Values.vaultMigration.roSecretId }}{{ .Values.vaultMigration.roSecretId | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
{{- end }}

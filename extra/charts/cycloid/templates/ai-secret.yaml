{{- if .Values.ai.enabled }}
{{- $secretName := printf "%s-ai" (include "cycloid.fullname" .) }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- $postgresPassword := "" }}
{{- $chromadbAuthToken := "" }}
{{- if $existingSecret }}
  {{- $postgresPassword = index $existingSecret.data "postgres-password" | b64dec }}
  {{- $chromadbAuthToken = index $existingSecret.data "chromadb-auth-token" | b64dec }}
{{- else }}
  {{- $postgresPassword = .Values.ai.postgres.password | default (randAlphaNum 32) }}
  {{- $chromadbAuthToken = .Values.ai.chromadb.authToken | default (randAlphaNum 64) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai
    {{- with .Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  postgres-password: {{ $postgresPassword | b64enc | quote }}
  chromadb-auth-token: {{ $chromadbAuthToken | b64enc | quote }}
  mistral-api-key: {{ .Values.ai.mistralApiKey | b64enc | quote }}
{{- end }}

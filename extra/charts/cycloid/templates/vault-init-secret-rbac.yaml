{{- if and .Values.vault.enabled .Values.vaultInitSecret.enabled }}
# Role and RoleBinding granting the vault pod's service account permission
# to write the init data (unseal keys + root token) to a K8s Secret.
# Only deployed when vaultInitSecret.enabled=true.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cycloid.fullname" . }}-vault-init-secret
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
    resourceNames:
      - {{ .Values.vaultInitSecret.secretName | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cycloid.fullname" . }}-vault-init-secret
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cycloid.fullname" . }}-vault-init-secret
subjects:
  - kind: ServiceAccount
    # vault-helm names its SA after the release: <release>-vault
    name: {{ .Release.Name }}-vault
    namespace: {{ .Release.Namespace | quote }}
{{- end }}

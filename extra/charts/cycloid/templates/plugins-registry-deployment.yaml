{{- if .Values.plugins.enabled }}
{{- $isK8s := eq .Values.plugins.deploymentRuntime "k8s" }}
{{- $pluginNs := default .Release.Namespace .Values.plugins.k8s.namespace }}
{{- range $name, $instance := .Values.plugins.pluginRegistry.instances }}
{{- $useLocal := true }}
{{- if hasKey $instance "use_local_registry" }}
  {{- $useLocal = $instance.use_local_registry }}
{{- end }}
{{- $instanceFullname := "" }}
{{- if eq $name "default" }}
  {{- $instanceFullname = include "plugins.pluginRegistry.fullname" $ }}
{{- else }}
  {{- $instanceFullname = printf "%s-plugin-registry-%s" (include "cycloid.fullname" $) $name | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- $registrySecretName := "" }}
{{- if $useLocal }}
  {{- $registrySecretName = include "plugins.dockerRegistry.secretName" $ }}
{{- else if hasKey $instance "existingSecret" }}
  {{- $registrySecretName = $instance.existingSecret }}
{{- else }}
  {{- $registrySecretName = $instanceFullname }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $instanceFullname }}
  labels:
    {{- include "cycloid.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $instanceFullname }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    {{- with $.Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $instanceFullname }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $instanceFullname }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.plugins.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.plugins.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $isK8s }}
      serviceAccountName: {{ default (include "plugins.pluginManager.fullname" $) $.Values.plugins.k8s.serviceAccount.name }}
      {{- end }}
      containers:
        - name: plugin-registry
          image: "{{ tpl $.Values.plugins.image.repository $ }}:{{ $.Values.plugins.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.plugins.image.pullPolicy }}
          args: ["/go/youdeploy-http-api", "plugin-registry"]
          {{- if not $isK8s }}
          # Containerd runtime requires privileged access.
          securityContext:
            privileged: true
          {{- end }}
          env:
            - name: PLUGIN_REGISTRY_ORGANIZATIONS
              value: {{ $.Values.plugins.orgsCans | quote }}
            - name: PLUGIN_REGISTRY_CYCLOID_URL
              value: {{ $.Values.backend.url | quote }}
            - name: PLUGIN_REGISTRY_PORT
              value: "4000"
            # LOG_LEVEL is the backend main-config key (no per-subcommand flag)
            - name: LOG_LEVEL
              value: {{ $.Values.plugins.pluginRegistry.logLevel | quote }}
            - name: PLUGIN_REGISTRY_INSECURE_SKIP_VERIFY
              value: {{ $.Values.plugins.pluginRegistry.insecureSkipVerify | quote }}
            {{- if $isK8s }}
            # Kubernetes worker runtime
            - name: PLUGIN_REGISTRY_WORKER_RUNTIME
              value: "k8s"
            - name: PLUGIN_REGISTRY_K8S_NAMESPACE
              value: {{ $pluginNs | quote }}
            {{- if $.Values.plugins.k8s.imagePullSecrets }}
            - name: PLUGIN_REGISTRY_K8S_IMAGE_PULL_SECRETS
              value: {{ $.Values.plugins.k8s.imagePullSecrets | quote }}
            {{- else if $.Values.plugins.dockerRegistry.enabled }}
            - name: PLUGIN_REGISTRY_K8S_IMAGE_PULL_SECRETS
              value: {{ include "plugins.dockerRegistry.pullSecretName" $ | quote }}
            {{- end }}
            {{- if $.Values.plugins.k8s.registryResources.requests.cpu }}
            - name: PLUGIN_REGISTRY_K8S_RESOURCES_CPU_REQUEST
              value: {{ $.Values.plugins.k8s.registryResources.requests.cpu | quote }}
            {{- end }}
            {{- if $.Values.plugins.k8s.registryResources.requests.memory }}
            - name: PLUGIN_REGISTRY_K8S_RESOURCES_MEMORY_REQUEST
              value: {{ $.Values.plugins.k8s.registryResources.requests.memory | quote }}
            {{- end }}
            {{- if $.Values.plugins.k8s.registryResources.limits.cpu }}
            - name: PLUGIN_REGISTRY_K8S_RESOURCES_CPU_LIMIT
              value: {{ $.Values.plugins.k8s.registryResources.limits.cpu | quote }}
            {{- end }}
            {{- if $.Values.plugins.k8s.registryResources.limits.memory }}
            - name: PLUGIN_REGISTRY_K8S_RESOURCES_MEMORY_LIMIT
              value: {{ $.Values.plugins.k8s.registryResources.limits.memory | quote }}
            {{- end }}
            {{- if $.Values.plugins.k8s.nodeSelector }}
            - name: PLUGIN_REGISTRY_K8S_NODE_SELECTOR
              value: {{ $.Values.plugins.k8s.nodeSelector | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- $dbName := $instance.databaseName | default "plugin_registry" }}
            {{- $redisDB := $instance.redisDatabase | default (include "cycloid.redisDatabase" $) }}
            # MySQL
            - name: PLUGIN_REGISTRY_DB_HOST
              value: {{ include "cycloid.mysqlHost" $ | quote }}
            - name: PLUGIN_REGISTRY_DB_PORT
              value: {{ include "cycloid.mysqlPort" $ | quote }}
            - name: PLUGIN_REGISTRY_DB_NAME
              value: {{ $dbName | quote }}
            - name: PLUGIN_REGISTRY_DB_USER
              value: {{ include "cycloid.mysqlUser" $ | quote }}
            - name: PLUGIN_REGISTRY_DB_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ template "cycloid.mysqlSecretName" $ }}
                  key: mysql-password
            - name: REDIS_HOST
              value: {{ include "cycloid.redisHost" $ | quote }}
            - name: REDIS_PORT
              value: {{ include "cycloid.redisPort" $ | quote }}
            - name: REDIS_DB
              value: {{ $redisDB | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "cycloid.redisSecretName" $ }}
                  key: redis-password
                  optional: true
            - name: PLUGIN_REGISTRY_REDIS_URI
              value: {{ include "cycloid.redisUri" $ | quote }}
            # Check if user defined a custom redis cert
            {{- $hasRedisCert := false }}
            {{- range $.Values.backend.extraSecretEnvVars }}
              {{- if eq .envName "REDIS_CA_CERT" }}
                {{- $hasRedisCert = true }}
              {{- end }}
            {{- end }}
            # If redis local and no custom redis cert, add the default
            {{- if and $.Values.redis.enabled (not $hasRedisCert) }}
            - name: "PLUGIN_REGISTRY_REDIS_CA_CERT"
              valueFrom:
                secretKeyRef:
                  name: cycloid-redis-crt
                  key: ca.crt
            {{- end }}
            # Docker registry creds (was `envFrom` secretRef); subcommand reads PLUGIN_REGISTRY_DOCKER_REGISTRY_*
            - name: PLUGIN_REGISTRY_DOCKER_REGISTRY_URI
              valueFrom:
                secretKeyRef:
                  name: {{ $registrySecretName }}
                  key: REGISTRY_URI
            - name: PLUGIN_REGISTRY_DOCKER_REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $registrySecretName }}
                  key: REGISTRY_USERNAME
            - name: PLUGIN_REGISTRY_DOCKER_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $registrySecretName }}
                  key: REGISTRY_PASSWORD
          ports:
            - containerPort: 4000
              protocol: TCP
          resources:
            {{- toYaml $.Values.plugins.pluginRegistry.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $instanceFullname }}
  labels:
    {{- include "cycloid.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $instanceFullname }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    {{- with $.Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $instanceFullname }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
---
{{- end }}
{{- end }}

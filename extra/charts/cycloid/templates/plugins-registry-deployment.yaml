{{- if .Values.plugins.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plugins.pluginRegistry.fullname" . }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    {{- include "plugins.pluginRegistry.selectorLabels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.plugins.pluginRegistry.replicaCount }}
  selector:
    matchLabels:
      {{- include "plugins.pluginRegistry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plugins.pluginRegistry.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.plugins.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.plugins.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: plugin-registry
          image: "{{ .Values.plugins.pluginRegistry.image.repository }}:{{ .Values.plugins.pluginRegistry.image.tag }}"
          imagePullPolicy: {{ .Values.plugins.pluginRegistry.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: ORGS_CANS
              value: {{ .Values.plugins.orgsCans | quote }}
            - name: CY_URL
              value: {{ .Values.backend.url | quote }}
            - name: RUN_MIGRATIONS
              value: "true"
            - name: PORT
              value: "4000"
            # MySQL
            - name: DB_HOST
              value: {{ include "cycloid.mysqlHost" . | quote }}
            - name: DB_PORT
              value: {{ include "cycloid.mysqlPort" . | quote }}
            - name: DB_NAME
              value: {{ .Values.plugins.pluginRegistryDatabaseName | quote }}
            - name: DB_USER
              value: {{ include "cycloid.mysqlUser" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "cycloid.mysqlSecretName" . }}
                  key: mysql-password
            # Redis
            - name: REDIS_HOST
              value: {{ include "cycloid.redisHost" . | quote }}
            - name: REDIS_PORT
              value: {{ include "cycloid.redisPort" . | quote }}
            - name: REDIS_DB
              value: {{ include "cycloid.redisDatabase" . | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "cycloid.redisSecretName" . }}
                  key: redis-password
                  optional: true
            - name: REDIS_URI
              value: {{ include "cycloid.redisUri" . | quote }}
            {{- if and .Values.redis.enabled }}
            - name: REDIS_CA_CERT
              valueFrom:
                secretKeyRef:
                  name: cycloid-redis-crt
                  key: ca.crt
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "plugins.secretName" . }}
          ports:
            - containerPort: 4000
              protocol: TCP
          resources:
            {{- toYaml .Values.plugins.pluginRegistry.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "plugins.pluginRegistry.fullname" . }}
  labels:
    {{- include "cycloid.labels" . | nindent 4 }}
    {{- include "plugins.pluginRegistry.selectorLabels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "plugins.pluginRegistry.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
{{- end }}
